<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字分解游戏 - 学习10和20的分解</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 90%;
            max-width: 800px;
            min-height: 600px;
            max-height: 95vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .start-screen, .result-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .start-screen h1, .result-screen h1 {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .start-screen p, .result-screen p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            padding: 15px 50px;
            font-size: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .mode-btn {
            padding: 20px 60px;
            font-size: 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            min-width: 300px;
        }

        .mode-btn.practice {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .mode-btn.competition {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .mode-btn.easy {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .mode-btn.medium {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .mode-btn.hard {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 5px 15px rgba(250, 112, 154, 0.4);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .mode-btn.practice:hover {
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.6);
        }

        .mode-btn.competition:hover {
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.6);
        }

        .mode-btn.easy:hover {
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.6);
        }

        .mode-btn.medium:hover {
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.6);
        }

        .mode-btn.hard:hover {
            box-shadow: 0 8px 20px rgba(250, 112, 154, 0.6);
        }

        .mode-description {
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.9;
        }

        .number-input-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .number-input-screen h2 {
            font-size: 36px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .number-input-screen input {
            width: 150px;
            height: 60px;
            font-size: 32px;
            text-align: center;
            border: 3px solid #667eea;
            border-radius: 15px;
            margin-bottom: 20px;
            outline: none;
        }

        .number-input-screen input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 20px rgba(118, 75, 162, 0.3);
        }

        .difficulty-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .difficulty-screen h2 {
            font-size: 36px;
            color: #667eea;
            margin-bottom: 30px;
        }

        .game-screen {
            display: none;
            height: 100%;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        .timer, .progress {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }

        .cards-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
            opacity: 0;
            transform: translateX(100%);
        }

        .card.active {
            opacity: 1;
            transform: translateX(0);
        }

        .card.removed {
            opacity: 0;
            transform: translateX(-100%);
        }

        .card.correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .card.wrong {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .card-number {
            font-size: 36px;
            color: #ccc;
            position: absolute;
            top: 20px;
            right: 30px;
        }

        .card-question {
            font-size: 48px;
            color: #667eea;
            margin: 20px 0;
            font-weight: bold;
        }

        .card.correct .card-question,
        .card.wrong .card-question {
            color: white;
        }

        .decomposition-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin: 30px 0;
        }

        .total-number {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }

        .card.correct .total-number,
        .card.wrong .total-number {
            color: white;
        }

        .boxes-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .number-box {
            width: 130px;
            height: 130px;
            border: 5px solid #667eea;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            font-weight: bold;
            background: white;
            color: #667eea;
        }

        .card.correct .number-box,
        .card.wrong .number-box {
            border-color: white;
            color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        .operator {
            font-size: 48px;
            color: #667eea;
            font-weight: bold;
        }

        .card.correct .operator,
        .card.wrong .operator {
            color: white;
        }

        .input-box {
            width: 130px;
            height: 130px;
            border: 5px solid #667eea;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card.correct .input-box,
        .card.wrong .input-box {
            border-color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        .card-input {
            width: 120px;
            height: 120px;
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            border: none;
            background: transparent;
            color: #667eea;
            outline: none;
        }

        .card-input:focus {
            outline: none;
        }

        .card.correct .card-input,
        .card.wrong .card-input {
            color: white;
        }

        .card-input::placeholder {
            color: #ccc;
        }

        .card.correct .card-input::placeholder,
        .card.wrong .card-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .card-feedback {
            font-size: 28px;
            margin-top: 15px;
            font-weight: bold;
        }

        .result-details {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            font-size: 18px;
        }

        .result-item.correct {
            background: rgba(56, 239, 125, 0.2);
        }

        .result-item.wrong {
            background: rgba(244, 92, 67, 0.2);
        }

        .result-item .question {
            font-weight: bold;
        }

        .result-item .answer {
            color: #667eea;
        }

        .result-item .correct-answer {
            color: #11998e;
            margin-left: 10px;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin: 20px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 16px;
            color: #777;
        }

        .hint {
            font-size: 16px;
            color: #999;
            margin-top: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-container {
                width: 95%;
                padding: 20px;
                border-radius: 20px;
            }

            .start-screen h1, .result-screen h1 {
                font-size: 32px;
            }

            .start-screen p, .result-screen p {
                font-size: 16px;
            }

            .btn {
                padding: 12px 40px;
                font-size: 18px;
            }

            .mode-btn {
                padding: 15px 40px;
                font-size: 18px;
                min-width: 250px;
            }

            .mode-description {
                font-size: 12px;
            }

            .number-input-screen h2,
            .difficulty-screen h2 {
                font-size: 28px;
            }

            .number-input-screen input {
                width: 120px;
                height: 50px;
                font-size: 28px;
            }

            .game-header {
                flex-direction: column;
                gap: 10px;
            }

            .timer, .progress {
                font-size: 18px;
            }

            .cards-container {
                height: 350px;
            }

            .card-question {
                font-size: 36px;
            }

            .total-number {
                font-size: 56px;
            }

            .number-box {
                width: 100px;
                height: 100px;
                font-size: 48px;
            }

            .input-box {
                width: 100px;
                height: 100px;
            }

            .card-input {
                width: 90px;
                height: 90px;
                font-size: 48px;
            }

            .operator {
                font-size: 36px;
            }

            .card-feedback {
                font-size: 20px;
            }

            .stat-value {
                font-size: 28px;
            }

            .stat-label {
                font-size: 14px;
            }

            .result-details {
                max-height: 200px;
                padding: 15px;
            }

            .result-item {
                font-size: 16px;
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            .game-container {
                width: 98%;
                padding: 15px;
                border-radius: 15px;
            }

            .start-screen h1, .result-screen h1 {
                font-size: 24px;
                margin-bottom: 15px;
            }

            .start-screen p, .result-screen p {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .btn {
                padding: 10px 30px;
                font-size: 16px;
            }

            .mode-btn {
                padding: 12px 30px;
                font-size: 16px;
                min-width: 200px;
            }

            .mode-description {
                font-size: 11px;
            }

            .number-input-screen h2,
            .difficulty-screen h2 {
                font-size: 24px;
            }

            .number-input-screen input {
                width: 100px;
                height: 45px;
                font-size: 24px;
            }

            .cards-container {
                height: 300px;
            }

            .card-number {
                font-size: 24px;
                top: 10px;
                right: 15px;
            }

            .card-question {
                font-size: 28px;
                margin: 15px 0;
            }

            .total-number {
                font-size: 42px;
            }

            .number-box,
            .input-box {
                width: 80px;
                height: 80px;
                border-width: 3px;
                border-radius: 15px;
            }

            .card-input {
                width: 70px;
                height: 70px;
                font-size: 36px;
            }

            .operator {
                font-size: 28px;
            }

            .boxes-container {
                gap: 15px;
            }

            .decomposition-container {
                gap: 15px;
                margin: 20px 0;
            }

            .card-feedback {
                font-size: 16px;
                margin-top: 10px;
            }

            .stats {
                gap: 15px;
            }

            .stat-value {
                font-size: 24px;
            }

            .stat-label {
                font-size: 12px;
            }

            .result-details {
                max-height: 150px;
                padding: 10px;
            }

            .result-item {
                font-size: 14px;
                padding: 6px;
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }

        @media (max-height: 700px) {
            .game-container {
                min-height: auto;
                max-height: 98vh;
            }

            .cards-container {
                height: 300px;
            }

            .start-screen h1, .result-screen h1 {
                font-size: 32px;
                margin-bottom: 10px;
            }

            .start-screen p, .result-screen p {
                margin-bottom: 15px;
            }

            .mode-buttons {
                gap: 10px;
                margin-top: 15px;
            }

            .mode-btn {
                padding: 15px 50px;
            }
        }

        @keyframes cardEnter {
            from {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .card {
            animation: cardEnter 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 开始界面 -->
        <div class="start-screen" id="startScreen">
            <h1>🎮 数字分解游戏</h1>
            <p>学习数字的分解<br>选择模式开始挑战！</p>
            <div class="mode-buttons">
                <div>
                    <button class="mode-btn practice" onclick="showNumberInput()">
                        📝 练习模式
                    </button>
                    <p class="mode-description">输入一个数字，练习该数字的所有分解</p>
                </div>
                <div>
                    <button class="mode-btn competition" onclick="showDifficultySelect()">
                        🏆 竞赛模式
                    </button>
                    <p class="mode-description">10道题，选择难度挑战</p>
                </div>
            </div>
        </div>

        <!-- 数字输入界面（练习模式） -->
        <div class="number-input-screen" id="numberInputScreen">
            <h2>请输入要练习的数字</h2>
            <input type="number" id="practiceNumber" min="2" max="20" placeholder="10" onkeypress="handleNumberInput(event)">
            <button class="btn" onclick="startPracticeMode()">开始练习</button>
        </div>

        <!-- 竞赛难度选择界面 -->
        <div class="difficulty-screen" id="difficultyScreen">
            <h2>选择竞赛难度</h2>
            <div class="mode-buttons">
                <div>
                    <button class="mode-btn easy" onclick="startGame('competition', 'easy')">
                        🌟 简单
                    </button>
                    <p class="mode-description">10道题，全是10以内数字的分解</p>
                </div>
                <div>
                    <button class="mode-btn medium" onclick="startGame('competition', 'medium')">
                        🌈 中等
                    </button>
                    <p class="mode-description">10道题，10以内和11-20各占一半</p>
                </div>
                <div>
                    <button class="mode-btn hard" onclick="startGame('competition', 'hard')">
                        🔥 困难
                    </button>
                    <p class="mode-description">10道题，全是11-20数字的分解</p>
                </div>
            </div>
            <button class="btn" style="margin-top: 20px;" onclick="backToStart()">返回</button>
        </div>

        <!-- 游戏界面 -->
        <div class="game-screen" id="gameScreen">
            <div class="game-header">
                <div class="timer">⏱️ <span id="timer">00:00</span></div>
                <div class="progress">题目: <span id="currentQuestion">1/10</span></div>
            </div>
            <div class="cards-container" id="cardsContainer">
                <!-- 卡片将通过JS动态生成 -->
            </div>
            <p class="hint">输入数字后按 Enter 键确认</p>
        </div>

        <!-- 结果界面 -->
        <div class="result-screen" id="resultScreen" style="display: none;">
            <h1>🎉 游戏结束！</h1>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="finalTime">00:00</div>
                    <div class="stat-label">用时</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">正确</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="wrongCount">0</div>
                    <div class="stat-label">错误</div>
                </div>
            </div>
            <div class="result-details" id="resultDetails">
                <!-- 结果详情将通过JS动态生成 -->
            </div>
            <button class="btn" onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let timer = 0;
        let timerInterval = null;
        let results = [];
        let gameStartTime = null;
        let currentQuestionStartTime = null;
        let currentMode = 'medium';
        let totalQuestions = 10;

        // 生成指定total的分解题目
        function generateQuestionsForTotal(total, count) {
            const questionList = [];
            for (let i = 0; i < count; i++) {
                // 随机生成第一个加数（1到total-1）
                const num1 = Math.floor(Math.random() * (total - 1)) + 1;
                const num2 = total - num1;

                questionList.push({
                    total: total,
                    num1: num1,
                    correctAnswer: num2
                });
            }
            return questionList;
        }

        // 洗牌算法，随机打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 根据模式生成题目
        function generateQuestions(mode, difficulty = null, practiceNumber = null) {
            currentMode = mode;
            let questionList = [];

            if (mode === 'practice') {
                // 练习模式：生成指定数字的所有分解
                const num = practiceNumber || 10;
                totalQuestions = num - 1; // 例如10的分解有9种：1+9, 2+8, ..., 9+1

                // 生成所有可能的分解组合
                for (let i = 1; i < num; i++) {
                    questionList.push({
                        total: num,
                        num1: i,
                        correctAnswer: num - i
                    });
                }

                // 随机打乱顺序
                questionList = shuffleArray(questionList);
            } else if (mode === 'competition') {
                // 竞赛模式：根据难度生成题目
                totalQuestions = 10;

                if (difficulty === 'easy') {
                    // 简单：全是10以内的数字（2-10）
                    for (let i = 0; i < 10; i++) {
                        const total = Math.floor(Math.random() * 9) + 2; // 2-10
                        const num1 = Math.floor(Math.random() * (total - 1)) + 1;

                        questionList.push({
                            total: total,
                            num1: num1,
                            correctAnswer: total - num1
                        });
                    }
                } else if (difficulty === 'medium') {
                    // 中等：10以内和11-20各占一半
                    // 前5道是10以内
                    for (let i = 0; i < 5; i++) {
                        const total = Math.floor(Math.random() * 9) + 2; // 2-10
                        const num1 = Math.floor(Math.random() * (total - 1)) + 1;

                        questionList.push({
                            total: total,
                            num1: num1,
                            correctAnswer: total - num1
                        });
                    }
                    // 后5道是11-20
                    for (let i = 0; i < 5; i++) {
                        const total = Math.floor(Math.random() * 10) + 11; // 11-20
                        const num1 = Math.floor(Math.random() * (total - 1)) + 1;

                        questionList.push({
                            total: total,
                            num1: num1,
                            correctAnswer: total - num1
                        });
                    }
                    // 打乱顺序
                    questionList = shuffleArray(questionList);
                } else if (difficulty === 'hard') {
                    // 困难：全是11-20的数字
                    for (let i = 0; i < 10; i++) {
                        const total = Math.floor(Math.random() * 10) + 11; // 11-20
                        const num1 = Math.floor(Math.random() * (total - 1)) + 1;

                        questionList.push({
                            total: total,
                            num1: num1,
                            correctAnswer: total - num1
                        });
                    }
                }
            }

            return questionList;
        }

        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 创建卡片
        function createCard(question, index) {
            const card = document.createElement('div');
            card.className = 'card';
            if (index === 0) {
                card.classList.add('active');
            }

            card.innerHTML = `
                <div class="card-number">${index + 1}</div>
                <div class="decomposition-container">
                    <div class="total-number">${question.total}</div>
                    <div class="boxes-container">
                        <div class="number-box">${question.num1}</div>
                        <div class="operator">+</div>
                        <div class="input-box">
                            <input type="number" class="card-input" id="input-${index}" placeholder="?" autocomplete="off">
                        </div>
                    </div>
                </div>
                <div class="card-feedback" id="feedback-${index}"></div>
            `;

            return card;
        }

        // 初始化游戏
        function initGame(mode, difficulty = null, practiceNumber = null) {
            questions = generateQuestions(mode, difficulty, practiceNumber);
            currentQuestionIndex = 0;
            timer = 0;
            results = [];
            gameStartTime = Date.now();
            currentQuestionStartTime = Date.now();

            document.getElementById('currentQuestion').textContent = `1/${totalQuestions}`;
            document.getElementById('timer').textContent = '00:00';

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            // 创建所有卡片
            questions.forEach((question, index) => {
                const card = createCard(question, index);
                container.appendChild(card);
            });

            // 聚焦第一个输入框
            setTimeout(() => {
                const input = document.getElementById('input-0');
                if (input) {
                    input.focus();
                }
            }, 100);
        }

        // 显示数字输入界面（练习模式）
        function showNumberInput() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('numberInputScreen').style.display = 'flex';
            document.getElementById('practiceNumber').focus();
        }

        // 处理数字输入的回车键
        function handleNumberInput(event) {
            if (event.key === 'Enter') {
                startPracticeMode();
            }
        }

        // 开始练习模式
        function startPracticeMode() {
            const input = document.getElementById('practiceNumber');
            let num = parseInt(input.value);

            // 验证输入
            if (isNaN(num) || num < 2 || num > 20) {
                alert('请输入2到20之间的数字');
                return;
            }

            document.getElementById('numberInputScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';

            initGame('practice', null, num);

            // 启动计时器
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').textContent = formatTime(timer);
            }, 1000);
        }

        // 显示竞赛难度选择界面
        function showDifficultySelect() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('difficultyScreen').style.display = 'flex';
        }

        // 返回开始界面
        function backToStart() {
            document.getElementById('difficultyScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
        }

        // 开始游戏
        function startGame(mode, difficulty = null) {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('difficultyScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';

            initGame(mode, difficulty);

            // 启动计时器
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').textContent = formatTime(timer);
            }, 1000);
        }

        // 检查答案
        function checkAnswer(questionIndex) {
            if (questionIndex !== currentQuestionIndex) return;

            const question = questions[questionIndex];
            const userAnswer = parseInt(document.getElementById(`input-${questionIndex}`).value);
            const card = document.querySelectorAll('.card')[questionIndex];
            const feedback = document.getElementById(`feedback-${questionIndex}`);

            if (isNaN(userAnswer)) {
                feedback.textContent = '请输入数字！';
                feedback.style.color = '#f45c43';
                return;
            }

            const isCorrect = userAnswer === question.correctAnswer;

            // 计算本题耗时
            const timeSpent = Math.round((Date.now() - currentQuestionStartTime) / 1000);

            // 记录结果
            results.push({
                question: `${question.total} = ${question.num1} + ?`,
                displayQuestion: `${question.total} 分解为 ${question.num1} 和 ?`,
                userAnswer: userAnswer,
                correctAnswer: question.correctAnswer,
                isCorrect: isCorrect,
                timeSpent: timeSpent
            });

            // 显示反馈
            if (isCorrect) {
                card.classList.add('correct');
                feedback.textContent = `✓ 正确！用时 ${formatTime(timeSpent)}`;
            } else {
                card.classList.add('wrong');
                feedback.textContent = `✗ 正确答案是 ${question.correctAnswer}，用时 ${formatTime(timeSpent)}`;
            }

            // 禁用输入框
            document.getElementById(`input-${questionIndex}`).disabled = true;

            // 移动到下一题
            setTimeout(() => {
                moveToNextQuestion();
            }, 1500);
        }

        // 移动到下一题
        function moveToNextQuestion() {
            const currentCard = document.querySelectorAll('.card')[currentQuestionIndex];
            currentCard.classList.remove('active');
            currentCard.classList.add('removed');

            currentQuestionIndex++;

            if (currentQuestionIndex >= totalQuestions) {
                // 游戏结束
                endGame();
            } else {
                // 记录下一题的开始时间
                currentQuestionStartTime = Date.now();

                // 激活下一张卡片
                const nextCard = document.querySelectorAll('.card')[currentQuestionIndex];
                if (nextCard) {
                    nextCard.classList.add('active');
                }

                // 更新进度
                document.getElementById('currentQuestion').textContent = `${currentQuestionIndex + 1}/${totalQuestions}`;

                // 聚焦下一个输入框
                setTimeout(() => {
                    const nextInput = document.getElementById(`input-${currentQuestionIndex}`);
                    if (nextInput) {
                        nextInput.focus();
                    }
                }, 300);
            }
        }

        // 结束游戏
        function endGame() {
            clearInterval(timerInterval);

            const correctCount = results.filter(r => r.isCorrect).length;
            const wrongCount = results.filter(r => !r.isCorrect).length;

            // 显示结果界面
            setTimeout(() => {
                document.getElementById('gameScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'flex';

                document.getElementById('finalTime').textContent = formatTime(timer);
                document.getElementById('correctCount').textContent = correctCount;
                document.getElementById('wrongCount').textContent = wrongCount;

                // 显示详细结果
                const detailsContainer = document.getElementById('resultDetails');
                detailsContainer.innerHTML = '<h3>答题详情：</h3>';

                results.forEach((result, index) => {
                    const item = document.createElement('div');
                    item.className = `result-item ${result.isCorrect ? 'correct' : 'wrong'}`;
                    item.innerHTML = `
                        <span>第${index + 1}题: ${result.displayQuestion}</span>
                        <span>
                            答案: ${result.userAnswer}
                            ${!result.isCorrect ? `<span class="correct-answer">(正确: ${result.correctAnswer})</span>` : ' ✓'}
                            <span style="margin-left: 10px; color: #666;">⏱️ ${formatTime(result.timeSpent)}</span>
                        </span>
                    `;
                    detailsContainer.appendChild(item);
                });
            }, 600);
        }

        // 重新开始
        function restartGame() {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
        }

        // 键盘事件监听
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('gameScreen').style.display === 'none') return;

            if (e.key === 'Enter') {
                const activeElement = document.activeElement;
                if (activeElement && activeElement.classList.contains('card-input')) {
                    const questionIndex = parseInt(activeElement.id.split('-')[1]);
                    checkAnswer(questionIndex);
                }
            }
        });

        // 全局键盘事件 - 监听数字输入
        document.addEventListener('keypress', (e) => {
            if (document.getElementById('gameScreen').style.display === 'none') return;

            const activeElement = document.activeElement;
            if (!activeElement || !activeElement.classList.contains('card-input')) {
                // 如果没有聚焦的输入框，自动聚焦当前题目的输入框
                const currentInput = document.getElementById(`input-${currentQuestionIndex}`);
                if (currentInput && !currentInput.disabled) {
                    currentInput.focus();
                }
            }
        });
    </script>
</body>
</html>
